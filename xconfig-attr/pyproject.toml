[build-system]
build-backend = "hatchling.build"
requires = [
    "hatch-requirements-txt",
    "hatchling",
]

[project]
authors = [
    { name = "Mingzhe Zou", email = "zoumingzhe@outlook.com" },
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
description = "Config module"
dynamic = [
    "dependencies",
    "version",
]
keywords = [
    "config",
    "configuration",
]
license-files = [
    "LICENSE",
]
name = "xkits-config-attr"
requires-python = ">=3.8"

[project.readme]
content-type = "text/markdown"
file = "readme.md"

[project.scripts]

[project.urls]
Homepage = "https://github.com/bondbox/xconfig/"

[tool.hatch.build.targets.sdist]
packages = [
    "xkits_config_attrs.py",
]

[tool.hatch.build.targets.wheel]
packages = [
    "xkits_config_attrs.py",
]

[tool.hatch.metadata.hooks.requirements_txt]
files = [
    "requirements.txt",
]

[tool.hatch.version]
path = "attribute.py"
