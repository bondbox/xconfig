[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-requirements-txt", "hatchling", "xpip-build>=1.4",]

[project]
classifiers = [ "Programming Language :: Python", "Programming Language :: Python :: 3",]
dynamic = [ "name", "urls", "authors", "version", "description", "dependencies",]
keywords = [ "config", "configuration",]
license-files = [ "LICENSE",]
requires-python = ">=3.8"

[project.readme]
content-type = "text/markdown"
file = "readme.md"

[project.scripts]

[tool.hatch.build.targets.sdist]
exclude = []
packages = [ "xkits_config_yaml.py",]

[tool.hatch.build.targets.wheel]
exclude = []
packages = [ "xkits_config_yaml.py",]

[tool.hatch.metadata.hooks.custom]

[tool.hatch.metadata.hooks.requirements_txt]
files = [ "requirements.txt",]

[tool.hatch.build.targets.sdist.force-include]

[tool.hatch.build.targets.wheel.force-include]
